<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberTrace AR - Futuristic Hand-Synchronized Drawing</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MediaPipe CDNs -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        body {
            font-family: 'Share Tech Mono', monospace;
            background-color: #0a0b10;
            color: #00f3ff;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        .cyber-border {
            border: 1px solid rgba(0, 243, 255, 0.4);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
            backdrop-filter: blur(12px);
            background: rgba(10, 11, 16, 0.7);
        }

        .cyber-border-pink {
            border: 1px solid rgba(255, 0, 85, 0.4);
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.2);
        }

        .scanline {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0, 243, 255, 0.05) 50%,
                rgba(0, 243, 255, 0.05)
            );
            background-size: 100% 4px;
        }

        /* Hide raw video, render via canvas/mirroring */
        #webcam {
            display: none;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            transform: scaleX(-1);
        }
    </style>
</head>
<body class="relative h-screen w-screen scanline">

    <!-- Hidden Video Feed for MediaPipe -->
    <video id="webcam" autoplay playsinline></video>

    <!-- Camera Feed & Drawing Canvas Layers -->
    <canvas id="output-canvas"></canvas>

    <!-- Futuristic HUD Overlay -->
    <div class="absolute inset-0 pointer-events-none flex flex-col justify-between p-6 z-10">
        
        <!-- Top Header & Telemetry -->
        <header class="flex justify-between items-center">
            <div class="cyber-border px-4 py-2 rounded flex items-center space-x-3">
                <span class="inline-block w-3 h-3 bg-cyan-400 rounded-full animate-pulse"></span>
                <h1 class="text-xl font-bold tracking-widest text-cyan-400 uppercase">CyberTrace AR // v1.0.4</h1>
            </div>
            
            <div class="cyber-border px-4 py-2 rounded text-xs space-y-1">
                <div>SYS.STATUS: <span id="status-text" class="text-yellow-400">CALIBRATING...</span></div>
                <div>FRAME RATE: <span id="fps-counter" class="text-cyan-400">0</span> FPS</div>
                <div>MODE: <span id="mode-text" class="text-cyan-400">HOVER</span></div>
            </div>
        </header>

        <!-- Center Crosshair / Reticle Container -->
        <div id="cursor-hud" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 hidden pointer-events-none">
            <div class="w-8 h-8 border-2 border-cyan-400 rounded-full animate-ping opacity-75"></div>
        </div>

        <!-- Bottom Controls & Palette (Pointer Events Enabled) -->
        <footer class="flex justify-between items-end pointer-events-auto">
            
            <!-- Color Swatches & Tools -->
            <div class="cyber-border p-3 rounded flex items-center space-x-3">
                <button onclick="setBrushColor('#00f3ff')" class="w-8 h-8 rounded-full bg-[#00f3ff] shadow-[0_0_10px_#00f3ff] focus:ring-2 focus:ring-white"></button>
                <button onclick="setBrushColor('#ff0055')" class="w-8 h-8 rounded-full bg-[#ff0055] shadow-[0_0_10px_#ff0055] focus:ring-2 focus:ring-white"></button>
                <button onclick="setBrushColor('#b000ff')" class="w-8 h-8 rounded-full bg-[#b000ff] shadow-[0_0_10px_#b000ff] focus:ring-2 focus:ring-white"></button>
                <button onclick="setBrushColor('#00ff66')" class="w-8 h-8 rounded-full bg-[#00ff66] shadow-[0_0_10px_#00ff66] focus:ring-2 focus:ring-white"></button>
                <button onclick="setBrushColor('#ffffff')" class="w-8 h-8 rounded-full bg-white shadow-[0_0_10px_#ffffff] focus:ring-2 focus:ring-cyan-400"></button>
                <div class="h-6 w-[1px] bg-cyan-900 mx-2"></div>
                <button onclick="toggleEraser()" id="eraser-btn" class="px-3 py-1 text-xs font-bold border border-cyan-400 text-cyan-400 hover:bg-cyan-400 hover:text-black transition rounded">ERASER: OFF</button>
            </div>

            <!-- Action Buttons -->
            <div class="cyber-border p-3 rounded flex items-center space-x-3">
                <button onclick="clearCanvas()" class="px-4 py-2 text-xs font-bold bg-red-950 text-red-400 border border-red-500 rounded hover:bg-red-900 transition">CLEAR GRID</button>
                <button onclick="saveSnapshot()" class="px-4 py-2 text-xs font-bold bg-cyan-950 text-cyan-400 border border-cyan-400 rounded hover:bg-cyan-900 transition">EXPORT PNG</button>
            </div>
        </footer>
    </div>

    <!-- Application Script Engine -->
    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output-canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const statusText = document.getElementById('status-text');
        const modeText = document.getElementById('mode-text');
        const fpsCounter = document.getElementById('fps-counter');
        const eraserBtn = document.getElementById('eraser-btn');

        let currentBrushColor = '#00f3ff';
        let isEraser = false;
        let lastX = null;
        let lastY = null;
        let paths = [];
        let currentPath = [];

        // FPS Calculation Variables
        let lastTime = performance.now();
        let frameCount = 0;
        let fps = 0;

        // Resize Canvas dynamically
        function resizeCanvas() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Persistent Offline Drawing Canvas Layer (for stored strokes)
        const persistentCanvas = document.createElement('canvas');
        const persistentCtx = persistentCanvas.getContext('2d');
        function resizePersistentCanvas() {
            persistentCanvas.width = window.innerWidth;
            persistentCanvas.height = window.innerHeight;
        }
        resizePersistentCanvas();

        function setBrushColor(color) {
            isEraser = false;
            currentBrushColor = color;
            eraserBtn.innerText = "ERASER: OFF";
            eraserBtn.classList.remove('border-pink-500', 'text-pink-400');
            eraserBtn.classList.add('border-cyan-400', 'text-cyan-400');
        }

        function toggleEraser() {
            isEraser = !isEraser;
            if (isEraser) {
                eraserBtn.innerText = "ERASER: ON";
                eraserBtn.classList.remove('border-cyan-400', 'text-cyan-400');
                eraserBtn.classList.add('border-pink-500', 'text-pink-400');
            } else {
                eraserBtn.innerText = "ERASER: OFF";
                eraserBtn.classList.remove('border-pink-500', 'text-pink-400');
                eraserBtn.classList.add('border-cyan-400', 'text-cyan-400');
            }
        }

        function clearCanvas() {
            persistentCtx.clearRect(0, 0, persistentCanvas.width, persistentCanvas.height);
            paths = [];
        }

        function saveSnapshot() {
            const link = document.createElement('a');
            link.download = `CyberTrace_${Date.now()}.png`;
            link.link = persistentCanvas.toDataURL();
            link.href = persistentCanvas.toDataURL('image/png');
            link.click();
        }

        // MediaPipe Hands Initialization
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.8,
            minTrackingConfidence: 0.8
        });

        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 1280,
            height: 720
        });
        camera.start().then(() => {
            statusText.innerText = "ONLINE";
            statusText.classList.remove('text-yellow-400');
            statusText.classList.add('text-green-400');
        }).catch(err => {
            statusText.innerText = "CAMERA ERROR";
            statusText.classList.remove('text-yellow-400');
            statusText.classList.add('text-red-500');
        });

        // Main Landmark & Gesture Processing Loop
        function onResults(results) {
            // Calculate FPS
            const now = performance.now();
            frameCount++;
            if (now - lastTime >= 1000) {
                fps = Math.round((frameCount * 1000) / (now - lastTime));
                fpsCounter.innerText = fps;
                frameCount = 0;
                lastTime = now;
            }

            // Clear frame canvas for rendering fresh video feed & overlays
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            
            // Draw Mirrored Video Background
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            // Draw Persistent Persistent Strokes Layer
            canvasCtx.drawImage(persistentCanvas, 0, 0);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];

                // Extract Key Landmarks: Index Tip (8) and Thumb Tip (4)
                const indexTip = landmarks[8];
                const thumbTip = landmarks[4];

                // Convert normalized coordinates to canvas dimensions
                const x8 = indexTip.x * canvasElement.width;
                const y8 = indexTip.y * canvasElement.height;
                const x4 = thumbTip.x * canvasElement.width;
                const y4 = thumbTip.y * canvasElement.height;

                // Calculate Euclidean pinch distance
                const pinchDistance = Math.hypot(x8 - x4, y8 - y4);
                const pinchThreshold = 45; // Pixel threshold for pinch activation

                const isDrawing = pinchDistance < pinchThreshold;

                if (isDrawing) {
                    modeText.innerText = isEraser ? "ERASING" : "DRAWING";
                    modeText.style.color = isEraser ? "#ff0055" : currentBrushColor;

                    if (lastX !== null && lastY !== null) {
                        persistentCtx.save();
                        if (isEraser) {
                            persistentCtx.globalCompositeOperation = 'destination-out';
                            persistentCtx.beginPath();
                            persistentCtx.arc(x8, y8, 30, 0, Math.PI * 2);
                            persistentCtx.fill();
                        } else {
                            persistentCtx.strokeStyle = currentBrushColor;
                            persistentCtx.lineWidth = 6;
                            persistentCtx.lineCap = 'round';
                            persistentCtx.lineJoin = 'round';
                            persistentCtx.shadowBlur = 15;
                            persistentCtx.shadowColor = currentBrushColor;

                            persistentCtx.beginPath();
                            persistentCtx.moveTo(lastX, lastY);
                            persistentCtx.lineTo(x8, y8);
                            persistentCtx.stroke();
                        }
                        persistentCtx.restore();
                    }
                    lastX = x8;
                    lastY = y8;
                } else {
                    modeText.innerText = "HOVERING";
                    modeText.style.color = "#00f3ff";
                    lastX = null;
                    lastY = null;
                }

                // Render Holographic Fingertip Cursor Reticle
                canvasCtx.save();
                canvasCtx.strokeStyle = isEraser ? '#ff0055' : currentBrushColor;
                canvasCtx.lineWidth = 2;
                canvasCtx.beginPath();
                canvasCtx.arc(x8, y8, isDrawing ? 12 : 18, 0, 2 * Math.PI);
                canvasCtx.stroke();
                
                // Inner core dot
                canvasCtx.fillStyle = isEraser ? '#ff0055' : currentBrushColor;
                canvasCtx.beginPath();
                canvasCtx.arc(x8, y8, 4, 0, 2 * Math.PI);
                canvasCtx.fill();
                canvasCtx.restore();

            } else {
                modeText.innerText = "NO HAND DETECTED";
                modeText.style.color = "#ffaa00";
                lastX = null;
                lastY = null;
            }

            canvasCtx.restore();
        }
    </script>
</body>
</html>
